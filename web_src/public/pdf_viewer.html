<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDF Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #f0f0f0;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #viewer {
    width: 100%; height: 100%;
    overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column;
    align-items: center; padding: 8px 0; gap: 8px;
  }
  .page-wrap {
    position: relative; display: inline-block;
    box-shadow: 0 1px 8px rgba(0,0,0,.15);
    background: #fff;
  }
  .page-wrap canvas { display: block; }
  /* The text you select sits invisibly over the drawn page. These rules are
     pdf.js 3.11's own text-layer styles: its span sizes and positions are
     calc(var(--scale-factor) * …), so without them (and --scale-factor, set
     per page below) every line lands in the wrong place and selections
     spill across columns. */
  .textLayer {
    position: absolute; text-align: initial; inset: 0;
    overflow: hidden; line-height: 1;
    -webkit-text-size-adjust: none; text-size-adjust: none;
    forced-color-adjust: none; transform-origin: 0 0; z-index: 2;
  }
  .textLayer :is(span, br) {
    color: transparent; position: absolute;
    white-space: pre; cursor: text;
    transform-origin: 0% 0%;
  }
  .textLayer span.markedContent { top: 0; height: 0; }
  .textLayer ::selection { background: rgba(75, 156, 211, .35); color: transparent; }
  .textLayer br::selection { background: transparent; }
  /* Keeps a drag-selection from jumping to the top of the page when the
     pointer leaves the text (pdf.js's endOfContent). */
  .textLayer .endOfContent {
    display: block; position: absolute; inset: 100% 0 0; z-index: -1;
    cursor: default; -webkit-user-select: none; user-select: none;
  }
  .textLayer .endOfContent.active { top: 0; }
  .textLayer span.ap-quote-flash {
    background: rgba(108, 99, 255, 0.42) !important;
    border-radius: 2px;
    box-shadow: 0 0 0 1px rgba(108, 99, 255, 0.35);
    transition: background 0.25s ease;
  }
  #empty {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; opacity: .4; user-select: none;
    font-size: 13px; color: #666;
  }
  #loading {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    font-size: 13px; color: #888; display: none;
  }
  #loading.visible { display: block; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
</style>
</head>
<body>
<div id="viewer">
  <div id="empty">No PDF loaded</div>
</div>
<div id="loading">Loading PDF...</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc = null, totalPages = 0;
// Only pages rangeStart..rangeEnd are shown (a book chapter); 1..totalPages otherwise.
let rangeStart = 1, rangeEnd = 0;
let pageObserver = null;

function clearPdf() {
  pdfDoc = null;
  totalPages = 0;
  document.getElementById('loading').classList.remove('visible');
  var vc = document.getElementById('viewer');
  vc.innerHTML = '';
  var empty = document.createElement('div');
  empty.id = 'empty';
  empty.textContent = 'No PDF loaded';
  vc.appendChild(empty);
  notifyParent('closed', {});
}

function loadPdf(url, opts) {
  opts = opts || {};
  var empty = document.getElementById('empty');
  if (empty) empty.style.display = 'none';
  document.getElementById('loading').classList.add('visible');
  var vc = document.getElementById('viewer');
  vc.innerHTML = '';
  pdfDoc = null; totalPages = 0;

  pdfjsLib.getDocument({ url: url }).promise.then(function(doc) {
    pdfDoc = doc;
    totalPages = doc.numPages;
    rangeStart = Math.max(1, parseInt(opts.start, 10) || 1);
    rangeEnd = Math.min(totalPages, parseInt(opts.end, 10) || totalPages);
    if (rangeEnd < rangeStart) { rangeStart = 1; rangeEnd = totalPages; }
    document.getElementById('loading').classList.remove('visible');
    renderAllPages();
    notifyParent('loaded', { pages: totalPages, start: rangeStart, end: rangeEnd });
    if (opts.quote) runScrollToQuote(opts.quote, opts.page || rangeStart);
    else if (opts.page) setTimeout(function () { goToPage(opts.page); }, 60);
  }).catch(function(err) {
    document.getElementById('loading').classList.remove('visible');
    var vc2 = document.getElementById('viewer');
    vc2.innerHTML = '<div id="empty" style="color:#c33">Error: ' + err.message + '</div>';
    notifyParent('error', { message: err.message });
  });
}

// Pages get a placeholder of the right size at once and are drawn only when
// they scroll near the view, so a 3,000-page book opens as fast as a leaflet.
function renderAllPages() {
  var vc = document.getElementById('viewer');
  vc.innerHTML = '';
  if (pageObserver) pageObserver.disconnect();
  pageObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting && !en.target.dataset.drawn) {
        en.target.dataset.drawn = '1';
        drawPage(parseInt(en.target.dataset.page, 10), en.target);
      }
    });
  }, { root: vc, rootMargin: '800px 0px' });
  pdfDoc.getPage(rangeStart).then(function (first) {
    var cw = vc.clientWidth - 20;
    var unscaled = first.getViewport({ scale: 1 });
    var scale = Math.max(0.5, cw / unscaled.width);
    for (var i = rangeStart; i <= rangeEnd; i++) {
      var wrap = document.createElement('div');
      wrap.className = 'page-wrap';
      wrap.dataset.page = i;
      wrap.style.width = Math.floor(unscaled.width * scale) + 'px';
      wrap.style.height = Math.floor(unscaled.height * scale) + 'px';
      vc.appendChild(wrap);
      pageObserver.observe(wrap);
    }
  });
}

function renderPage(num, container) {
  var wrap = document.createElement('div');
  wrap.className = 'page-wrap';
  wrap.dataset.page = num;
  container.appendChild(wrap);
  drawPage(num, wrap);
}

function drawPage(num, wrap) {
  pdfDoc.getPage(num).then(function(page) {
    var cw = document.getElementById('viewer').clientWidth - 20;
    var unscaled = page.getViewport({ scale: 1 });
    var scale = Math.max(0.5, cw / unscaled.width);
    var viewport = page.getViewport({ scale: scale });
    var dpr = window.devicePixelRatio || 1;

    wrap.style.width = viewport.width + 'px';
    wrap.style.height = viewport.height + 'px';
    wrap.style.setProperty('--scale-factor', viewport.scale);

    var canvas = document.createElement('canvas');
    canvas.width = Math.floor(viewport.width * dpr);
    canvas.height = Math.floor(viewport.height * dpr);
    canvas.style.width = viewport.width + 'px';
    canvas.style.height = viewport.height + 'px';
    wrap.appendChild(canvas);

    var ctx = canvas.getContext('2d');
    var transform = dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null;

    page.render({ canvasContext: ctx, viewport: viewport, transform: transform }).promise.then(function() {
      var textDiv = document.createElement('div');
      textDiv.className = 'textLayer';
      textDiv.style.width = viewport.width + 'px';
      textDiv.style.height = viewport.height + 'px';
      wrap.appendChild(textDiv);

      page.getTextContent().then(function(tc) {
        pdfjsLib.renderTextLayer({
          textContentSource: tc,
          container: textDiv,
          viewport: viewport,
        }).promise.then(function() {
          var end = document.createElement('div');
          end.className = 'endOfContent';
          textDiv.appendChild(end);
          textDiv.addEventListener('mousedown', function() { end.classList.add('active'); });
        }).catch(function() {});
      });
    });
  });
}

function goToPage(n) {
  if (!pdfDoc) return;
  var wrap = document.querySelector('.page-wrap[data-page="' + n + '"]');
  if (wrap) wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function normalizeQuoteText(s) {
  if (!s) return '';
  return String(s).toLowerCase().replace(/\s+/g, ' ').trim();
}

function flashQuoteSpan(el) {
  if (!el) return;
  el.classList.add('ap-quote-flash');
  setTimeout(function () { el.classList.remove('ap-quote-flash'); }, 2200);
}

/** @returns {boolean} true if a match was scrolled into view */
function findQuoteOnPage(pageWrap, rawQuote) {
  var spans = pageWrap.querySelectorAll('.textLayer span');
  if (!spans.length) return false;
  var nq = normalizeQuoteText(rawQuote);
  if (nq.length < 6) return false;
  var blob = '';
  var i = 0;
  for (i = 0; i < spans.length; i++) {
    blob += (spans[i].textContent || '');
  }
  var nb = normalizeQuoteText(blob);
  var needle = nq;
  var idx = nb.indexOf(needle);
  if (idx === -1) {
    for (var L = Math.min(needle.length, 500); L >= 18; L = Math.floor(L * 0.86)) {
      needle = nq.slice(0, L);
      idx = nb.indexOf(needle);
      if (idx !== -1) break;
    }
  }
  if (idx === -1) return false;
  blob = '';
  var accNorm = '';
  for (i = 0; i < spans.length; i++) {
    var span = spans[i];
    var t = span.textContent || '';
    blob += t;
    accNorm = normalizeQuoteText(blob);
    var needLen = Math.min(24, needle.length);
    if (accNorm.length >= idx + needLen) {
      span.scrollIntoView({ behavior: 'smooth', block: 'center' });
      flashQuoteSpan(span);
      return true;
    }
  }
  return false;
}

/** @returns {boolean} */
function scrollToQuote(quote, preferredPage) {
  if (!pdfDoc || !quote) return false;
  var nq = normalizeQuoteText(quote);
  if (nq.length < 6) {
    goToPage(preferredPage || 1);
    return true;
  }
  var order = [];
  var pp = parseInt(preferredPage, 10) || 1;
  if (pp >= 1 && pp <= totalPages) order.push(pp);
  var p = 1;
  for (p = rangeStart; p <= (rangeEnd || totalPages); p++) {
    if (p !== pp) order.push(p);
  }
  for (var oi = 0; oi < order.length; oi++) {
    var pw = document.querySelector('.page-wrap[data-page="' + order[oi] + '"]');
    if (pw && findQuoteOnPage(pw, quote)) {
      pw.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return true;
    }
  }
  goToPage(pp);
  return false;
}

function runScrollToQuote(quote, page) {
  var tries = 0;
  function attempt() {
    tries++;
    if (!pdfDoc) return;
    if (scrollToQuote(quote, page)) {
      notifyParent('jumpDone', { ok: true });
      return;
    }
    if (tries < 18) setTimeout(attempt, 200);
    else {
      goToPage(parseInt(page, 10) || 1);
      notifyParent('jumpDone', { ok: false });
    }
  }
  setTimeout(attempt, 120);
}

// Plain text of pages from..to (for Ask and for drafting a whole page).
function getText(from, to) {
  if (!pdfDoc) return Promise.resolve('');
  from = Math.max(1, from || rangeStart); to = Math.min(totalPages, to || from);
  var jobs = [];
  for (var i = from; i <= to; i++) {
    jobs.push(pdfDoc.getPage(i).then(function (pg) {
      return pg.getTextContent().then(function (tc) {
        var out = '', lastY = null;
        tc.items.forEach(function (it) {
          var y = it.transform ? it.transform[5] : null;
          if (lastY !== null && y !== null && Math.abs(y - lastY) > 2) out += '\n';
          out += it.str;
          if (it.hasEOL) out += '\n';
          lastY = y;
        });
        return '[Page ' + pg.pageNumber + ']\n' + out.replace(/[ \t]+/g, ' ').trim();
      });
    }));
  }
  return Promise.all(jobs).then(function (parts) { return parts.join('\n\n'); });
}

// Bookmarks flattened to [{title, page, level}], plus the page labels the PDF
// carries (printed page numbers), for "Attach a book".
function getOutline() {
  if (!pdfDoc) return Promise.resolve({ items: [], labels: null, pages: 0 });
  var out = [];
  function walk(items, level) {
    var chain = Promise.resolve();
    (items || []).forEach(function (it) {
      chain = chain.then(function () {
        var dest = it.dest;
        var p = typeof dest === 'string' ? pdfDoc.getDestination(dest) : Promise.resolve(dest);
        return p.then(function (d) {
          if (!d || !d[0]) return null;
          return typeof d[0] === 'object' ? pdfDoc.getPageIndex(d[0]) : Promise.resolve(d[0]);
        }).catch(function () { return null; }).then(function (idx) {
          if (idx !== null && idx !== undefined) out.push({ title: (it.title || '').trim(), page: idx + 1, level: level });
          if (level < 2) return walk(it.items, level + 1);
        });
      });
    });
    return chain;
  }
  return pdfDoc.getOutline().then(function (outline) { return walk(outline, 0); })
    .then(function () { return pdfDoc.getPageLabels().catch(function () { return null; }); })
    .then(function (labels) { return { items: out, labels: labels, pages: totalPages }; });
}

function getVisiblePage() {
  var vc = document.getElementById('viewer');
  var wraps = vc.querySelectorAll('.page-wrap');
  var top = vc.scrollTop + 40;
  for (var i = 0; i < wraps.length; i++) {
    if (wraps[i].offsetTop + wraps[i].offsetHeight > top) return parseInt(wraps[i].dataset.page || '1');
  }
  return rangeStart || 1;
}

function notifyParent(type, data) {
  try {
    var msg = { source: 'pdf-viewer', type: type };
    for (var k in data) msg[k] = data[k];
    window.parent.postMessage(msg, '*');
  } catch(e) {}
}

window.addEventListener('message', function(e) {
  var d = e.data;
  if (!d || d.source !== 'ankipapers') return;
  if (d.cmd === 'clear') clearPdf();
  if (d.cmd === 'load') loadPdf(d.url, d);
  if (d.cmd === 'getText') getText(d.from, d.to).then(function (t) { notifyParent('text', { id: d.id, text: t }); });
  if (d.cmd === 'getOutline') getOutline().then(function (o) { notifyParent('outline', { id: d.id, outline: o }); })
    .catch(function (e) { notifyParent('outline', { id: d.id, outline: { items: [], labels: null, pages: totalPages }, error: String(e) }); });
  if (d.cmd === 'goToPage') goToPage(d.page);
  if (d.cmd === 'scrollToQuote') runScrollToQuote(d.quote || '', d.page || 1);
});

document.getElementById('viewer').addEventListener('scroll', function() {
  var p = getVisiblePage();
  notifyParent('page', { page: p, total: totalPages });
});

document.addEventListener('mouseup', function() {
  document.querySelectorAll('.endOfContent.active').forEach(function (el) { el.classList.remove('active'); });
  setTimeout(function() {
    var sel = window.getSelection();
    var text = (sel ? sel.toString() : '').trim();
    if (text) {
      var page = getVisiblePage(), rect = null;
      try {
        var r = sel.getRangeAt(0);
        var node = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement;
        var wrap = node && node.closest ? node.closest('.page-wrap') : null;
        if (wrap) page = parseInt(wrap.dataset.page, 10) || page;
        var b = r.getBoundingClientRect();
        rect = { top: b.top, left: b.left, bottom: b.bottom, right: b.right };
      } catch (e) {}
      notifyParent('selection', { text: text, page: page, rect: rect });
    } else {
      notifyParent('selection', { text: '', page: getVisiblePage() });
    }
  }, 10);
});

/*
 * Copy as one line. pdf.js ends every rendered line with a <br>, so a plain
 * copy carries a hard break wherever the PDF wrapped, and pasting it into the
 * editor made one block per printed line. Same rules as normalizePastedText in
 * BlockEditor.jsx: words hyphenated across a break are rejoined, a hyphen
 * that only happened to wrap is kept, and every other break becomes a space.
 */
function flattenCopiedText(raw) {
  return String(raw || '')
    .replace(/\r\n?/g, '\n')
    .replace(/­/g, '')
    // "propa-" + break + "gation" -> "propagation" (lowercase both sides only)
    .replace(/([a-z])[-‐‑]\n\s*([a-z])/g, '$1$2')
    // "ST-" + break + "elevation" -> "ST-elevation"
    .replace(/([A-Za-z])([-‐‑])\n\s*([A-Za-z])/g, '$1$2$3')
    .replace(/\s*\n\s*/g, ' ')
    .replace(/[ \t  - ]+/g, ' ')
    .trim();
}

document.addEventListener('copy', function(e) {
  var sel = window.getSelection();
  var text = flattenCopiedText(sel ? sel.toString() : '');
  if (!text || !e.clipboardData) return;
  e.clipboardData.setData('text/plain', text);
  e.preventDefault();
});

var resizeTimer;
window.addEventListener('resize', function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function() { if (pdfDoc) renderAllPages(); }, 200);
});
</script>
</body>
</html>
